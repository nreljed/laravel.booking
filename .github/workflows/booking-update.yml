name: Booking Update (booking-module)

on:
  schedule:
    # Weekly: Monday 09:30 UTC, offset from the platform cadence.
    - cron: "30 9 * * 1"
  workflow_dispatch:
    # Inputs are accepted for parity with the booking-module repo's notification
    # dispatch (it posts inputs[tag]/inputs[branch]); the lock bump is derived
    # from composer.lock resolution, so these are informational only.
    inputs:
      tag:
        description: "booking-module release tag that triggered this run"
        required: false
        type: string
      branch:
        description: "booking-module branch to update from"
        required: false
        type: string
        default: main
  repository_dispatch:
    types: [booking-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: booking-update
  cancel-in-progress: true

# Flow: bump composer.lock -> FULL local validation (same suite as ci.yml)
# -> open lock-only PR -> squash-merge immediately.
#
# Why validate here instead of relying on PR checks: bot-authored PRs land
# in "action_required" limbo on these repos, and free private repos have no
# branch protection (so `gh pr merge --auto` can never fire). Validating the
# exact tree in this job makes an instant merge safe; the PR stays as the
# audit trail. If validation fails, the job fails and NO merge happens.
#
# A validation failure still opens the PR. That is the whole difference between
# a diagnosable failure and a mystery: the first booking-module release whose
# behaviour change this app's suite pinned made this job go red at
# `Validate — PHP tests` with no branch, no PR and no diff to look at - just a
# failed run on a schedule. The cause is one assertion, a two-minute fix once
# you can see it, but nothing in the failed run said that. Opening the PR
# unconditionally turns "the automation broke" into "this version needs its
# tests updated", with the exact red test quoted in the PR body.
#
# The safety property is unchanged and still the point: the merge step is gated
# on `success()`, so a failed validation can never auto-merge. It only changes
# what the failure leaves behind.

jobs:
  booking-update:
    # Runner switch (self-hosted ⇄ GitHub-hosted): RUNNER_CI var on this repo.
    # setup-php is skipped on the self-hosted Windows runner (preinstalled) and
    # runs on GitHub-hosted Linux.
    runs-on: ${{ vars.RUNNER_CI || 'self-hosted' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # PHP 8.4 + composer are preinstalled on the self-hosted runner;
      # setup-php only makes sense on GitHub-hosted machines.
      - name: Setup PHP
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, fileinfo, sqlite3, pdo_sqlite, bcmath, zip, gd, intl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # platform + booking-module are private vcs repos; the single
      # GH_TOKEN (Contents: Read on all nreljed repos, see AGENTS.md)
      # authenticates both clones. --no-scripts avoids booting Laravel in a
      # bare checkout (no .env needed for the lock update).
      - name: Update booking-module
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer update nreljed/booking-module --with-dependencies --no-scripts --no-interaction

      - name: Check for changes
        id: check
        run: |
          if git diff --exit-code -- composer.lock > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Booking module is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New booking-module version available."
          fi

      - name: Read resolved booking-module version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          VER=$(php -r 'echo json_decode(file_get_contents("vendor/nreljed/booking-module/composer.json"), true)["version"] ?? "unknown";')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # Full validation against the UPDATED lock — mirrors ci.yml exactly
      # (migrations + phpunit + typecheck + production build).
      # Step-per-command (mirrors ci.yml) — combined blocks die silently on this runner.
      - name: Validate — composer install
        if: steps.check.outputs.changed == 'true'
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: |
          cp .env.example .env
          touch database/database.sqlite
          composer install --prefer-dist --no-interaction

      - name: Validate — foundation check
        if: steps.check.outputs.changed == 'true'
        run: php scripts/foundation-check.php

      - name: Validate — key generate + migrate
        if: steps.check.outputs.changed == 'true'
        run: php artisan key:generate && php artisan migrate --force

      - name: Validate — npm install + typecheck + build
        if: steps.check.outputs.changed == 'true'
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm run check:core-deps
          npm run typecheck
          npm run build

      # Assets must exist before PHP tests: view-rendering tests hit @vite()
      # and 500 without public/build/manifest.json (same order as ci.yml).
      #
      # `id: tests` so the PR body below can report the real outcome. No
      # `continue-on-error` - a failure here has to keep the job red so the
      # merge step's `success()` gate stays shut.
      - name: Validate — PHP tests
        if: steps.check.outputs.changed == 'true'
        id: tests
        shell: bash
        run: php -d max_execution_time=0 -d memory_limit=512M artisan test --compact

      - name: Validate — Laravel Pint
        if: steps.check.outputs.changed == 'true'
        run: vendor/bin/pint --test

      # `!cancelled()` rather than plain `success()`: this step is the artifact
      # that makes a validation failure diagnosable, so it has to run *because*
      # validation failed, not despite it. Guarded against cancellation so it
      # cannot resurrect a superseded run.
      # `${{ }}` wrapper, not a bare `!cancelled()`: YAML reads a leading `!` as
      # a tag indicator, so the unquoted form fails to parse the whole workflow
      # file rather than just this condition.
      - name: Create pull request
        if: ${{ !cancelled() && steps.check.outputs.changed == 'true' }}
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          BRANCH="booking/update-v${{ steps.version.outputs.version }}"
          VERSION="${{ steps.version.outputs.version }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Clean up a stale branch left behind by a previously failed run.
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: update booking-module to v$VERSION"
          git push -u origin "$BRANCH"

          # Assembled with single-quoted `printf` and handed to `gh` as a file.
          # A multi-line double-quoted shell string is the trap here: its
          # continuation lines sit at column 1, which silently terminates the
          # YAML block scalar and corrupts the entire workflow file rather than
          # just this step. Single-quoted format strings also mean the markdown
          # backticks need no escaping.
          if [ "$TESTS_OUTCOME" = "success" ]; then
            SUFFIX=""
            NOTE="Full validation (migrations, tests, typecheck, build) passed on this exact tree, so this PR is queued for automatic squash-merge."
          else
            SUFFIX=" (validation failed - needs test updates)"
            NOTE="**This PR will not be auto-merged.** Full validation failed on this exact tree - see the \`Validate — PHP tests\` step in the failing run: $RUN_URL -- that is expected when a new release changes behaviour this app's suite pins, because the lock bump and the assertions describing it have to land together and only a human can tell which side is wrong. Check whether the failing test asserts superseded behaviour (update it) or catches a real regression (do not merge - fix the package instead). Push the fix to this branch and merge."
          fi

          printf 'Automated update of `nreljed/booking-module` (`booking-update.yml`).\n\n- Resolved version: v%s\n- Only `composer.lock` changed.\n\n%s\n' "$VERSION" "$NOTE" > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update booking-module to v$VERSION$SUFFIX" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      # Free private repos have no branch protection rules, so the merge is
      # instantaneous once issued. Validation already passed above; merging
      # fires deploy.yml (build + release + deploy).
      #
      # `success()` is the safety property this workflow exists for: it is false
      # whenever any earlier step failed, so a red validation leaves an open PR
      # for a human and never a silent merge. The PR body says which case it is.
      #
      # Use the PAT (secrets.GH_TOKEN), NOT github.token: pushes made with
      # GITHUB_TOKEN do NOT emit a `push` event (GitHub suppresses recursive
      # workflow runs), so a github.token merge would silently skip deploy.yml.
      - name: Merge pull request
        if: success() && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.pr.outputs.branch }}"