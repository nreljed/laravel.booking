name: Deploy to Production

# All three jobs execute on win-runner-booking (single self-hosted machine,
# jobs run sequentially). deploy.zip is handed off via a fixed local staging
# dir instead of GitHub artifacts — artifact storage counts against the
# account-wide quota and exhausted it (2026-08-22 deploy failure). Hosted
# runners are billing-blocked account-wide, so release/push-deploy stay
# self-hosted too.
env:
  DEPLOY_STAGING: C:/actions-runner-booking/_staging

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  release:
    needs: package
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        shell: pwsh
        run: |
          $gcUrl = "https://github.com/orhun/git-cliff/releases/download/v2.8.0/git-cliff-2.8.0-x86_64-pc-windows-msvc.zip"
          $gcZip = "$env:TEMP\git-cliff-release.zip"
          Invoke-WebRequest -Uri $gcUrl -OutFile $gcZip -ErrorAction Stop
          Expand-Archive -Path $gcZip -DestinationPath "$env:TEMP\git-cliff-release" -Force
          $gc = Get-ChildItem -Path "$env:TEMP\git-cliff-release" -Recurse -Filter "git-cliff.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $gc --unreleased --strip header -o release-notes.md 2>$null
          if (-not (Test-Path release-notes.md) -or (Get-Item release-notes.md).Length -eq 0) {
            Write-Output "No changes for this release" | Set-Content release-notes.md
          }
          & $gc -o CHANGELOG.md 2>$null

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VER="v${{ needs.package.outputs.version }}"
          gh release create "$VER" "$DEPLOY_STAGING/deploy.zip" \
            --repo nreljed/laravel.booking \
            --title "$VER" \
            --notes-file release-notes.md

  push-deploy:
    needs: [package, release]
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
    steps:
      - name: Upload deploy archive to server
        run: |
          VER="v${{ needs.package.outputs.version }}"
          echo "Release: $VER"
          # Capture upload response: check for JSON (real app) vs HTML (Cloudflare)
          UPLOAD_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -F "file=@$DEPLOY_STAGING/deploy.zip;filename=deploy.zip" \
            "https://booking.laravel.tunispromo.tn/deploy/upload?token=${{ secrets.DEPLOY_TOKEN }}" 2>&1)
          HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
          BODY=$(echo "$UPLOAD_RESP" | sed '$d')
          if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | head -1 | grep -q '^{'; then
            echo "Deployed via /deploy/upload"
            echo "$BODY" | head -1
          elif CHECK_RESP=$(curl -s -X POST --max-time 300 \
            "https://booking.laravel.tunispromo.tn/deploy/check?token=${{ secrets.DEPLOY_TOKEN }}" 2>&1) \
            && echo "$CHECK_RESP" | head -1 | grep -q '^{'; then
            echo "Deployed via /deploy/check (GitHub API)"
            echo "$CHECK_RESP" | head -1
          else
            echo "Deploy failed. Release created at:"
            echo "https://github.com/nreljed/laravel.booking/releases/tag/$VER"
            echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
            echo "https://booking.laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
            exit 1
          fi

      - name: FTP Upload fallback (DirectAdmin)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ftpUrl = "ftp://${{ secrets.FTP_SERVER }}/domains/booking.laravel.tunispromo.tn/public_html/deploy.zip"
          $cred = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try {
            $ftp = [System.Net.FtpWebRequest]::Create($ftpUrl)
            $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $ftp.Credentials = $cred
            $ftp.UseBinary = $true
            $ftp.UsePassive = $true
            $ftp.KeepAlive = $false
            $fileBytes = [System.IO.File]::ReadAllBytes("$env:DEPLOY_STAGING/deploy.zip")
            $ftp.ContentLength = $fileBytes.Length
            $rs = $ftp.GetRequestStream()
            $rs.Write($fileBytes, 0, $fileBytes.Length)
            $rs.Close()
            $resp = $ftp.GetResponse()
            Write-Output "FTP upload OK: $($resp.StatusDescription)"
            $resp.Close()
            Write-Output "---"
            Write-Output "Extract via DirectAdmin File Manager, then visit:"
            Write-Output "https://booking.laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          } catch {
            Write-Output "FTP upload failed: $_"
            $VER = "${{ steps.version.outputs.version }}"
            Write-Output "Manual steps:"
            Write-Output "1. Download from: https://github.com/nreljed/laravel.booking/releases/download/v$VER/deploy.zip"
            Write-Output "2. Upload via DirectAdmin File Manager to public_html/"
            Write-Output "3. Extract, then visit:"
            Write-Output "   https://booking.laravel.tunispromo.tn/deploy/cache-clear?token=${{ secrets.DEPLOY_TOKEN }}"
          }
