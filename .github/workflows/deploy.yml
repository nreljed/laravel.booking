name: Deploy to Production

# All three jobs execute on win-runner-booking (single self-hosted machine,
# jobs run sequentially). deploy.zip is handed off via a fixed local staging
# dir instead of GitHub artifacts — artifact storage counts against the
# account-wide quota and exhausted it (2026-08-22 deploy failure). Hosted
# runners are billing-blocked account-wide, so release/push-deploy stay
# self-hosted too.
env:
  DEPLOY_STAGING: C:/actions-runner-booking/_staging

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    needs: ci
    uses: ./.github/workflows/deploy-package.yml
    with:
      version: ""
    secrets: inherit

  release:
    needs: package
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        shell: pwsh
        run: |
          $gcUrl = "https://github.com/orhun/git-cliff/releases/download/v2.8.0/git-cliff-2.8.0-x86_64-pc-windows-msvc.zip"
          $gcZip = "$env:TEMP\git-cliff-release.zip"
          Invoke-WebRequest -Uri $gcUrl -OutFile $gcZip -ErrorAction Stop
          Expand-Archive -Path $gcZip -DestinationPath "$env:TEMP\git-cliff-release" -Force
          $gc = Get-ChildItem -Path "$env:TEMP\git-cliff-release" -Recurse -Filter "git-cliff.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $gc --unreleased --strip header -o release-notes.md 2>$null
          if (-not (Test-Path release-notes.md) -or (Get-Item release-notes.md).Length -eq 0) {
            Write-Output "No changes for this release" | Set-Content release-notes.md
          }
          & $gc -o CHANGELOG.md 2>$null

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VER="v${{ needs.package.outputs.version }}"
          gh release create "$VER" "$DEPLOY_STAGING/deploy.zip" \
            --repo nreljed/laravel.booking \
            --title "$VER" \
            --notes-file release-notes.md

  push-deploy:
    needs: [package, release]
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
    # Canonical check-first flow (shared with laravel + shop): /deploy/check makes
    # the server pull deploy.zip from the GitHub API itself. The host's security
    # layer may cut long connections (~100s) or block CI IPs mid-extract — hence
    # polling + confirm loops. If everything fails, the server still self-deploys
    # via its scheduled deploy:auto within minutes.
    steps:
      - name: Push GITHUB_TOKEN to server .env
        # Runs before the check so the server can authenticate against the GitHub
        # API when pulling the release itself (/deploy/env merges single values).
        # Pipe-free: under pipefail, `echo | head` can die SIGPIPE (141) on large
        # non-JSON bodies, silently skipping the token push.
        if: always()
        continue-on-error: true
        run: |
          ENV_URL="${{ vars.APP_URL }}/deploy/env?token=${{ secrets.DEPLOY_TOKEN }}"
          PAYLOAD="{\"values\":{\"GITHUB_TOKEN\":\"${{ secrets.GH_TOKEN }}\"}}"
          CONFIRMED=""
          for i in 1 2 3; do
            if RESP=$(curl -sS -X POST --max-time 60 -H "Content-Type: application/json" \
                 -d "$PAYLOAD" "$ENV_URL" 2>&1); then
              case "$RESP" in
                *'"success":true'*) CONFIRMED=yes; break ;;
              esac
            else
              RESP="curl failed: $?"
            fi
            echo "[env $i/3] ${RESP:0:160}"
            [ "$i" -lt 3 ] && sleep 20
          done
          if [ -n "$CONFIRMED" ]; then
            echo "GITHUB_TOKEN pushed to server .env"
          else
            echo "::warning::GITHUB_TOKEN push NOT confirmed after 3 attempts - update manually: POST $ENV_URL with {\"values\":{\"GITHUB_TOKEN\":\"<value>\"}}"
            exit 1
          fi

      - name: Check-first deploy with polling
        run: |
          VER="v${{ needs.package.outputs.version }}"
          APP_URL="${{ vars.APP_URL }}"
          DEPLOY_TOKEN="${{ secrets.DEPLOY_TOKEN }}"
          CHECK_URL="$APP_URL/deploy/check?token=$DEPLOY_TOKEN"
          UPLOAD_URL="$APP_URL/deploy/upload?token=$DEPLOY_TOKEN"
          STAGING_ZIP="$(cygpath "$DEPLOY_STAGING")/deploy.zip"
          echo "Release: $VER"

          # Server pulls deploy.zip from GitHub itself; during extraction it returns
          # HTML/500 transiently ("still busy"). Poll until deployed/current/$VER.
          poll_check() {
            for i in 1 2 3 4 5 6 7 8; do
              RESP=$(curl -s -X POST --max-time 120 "$CHECK_URL" 2>&1)
              FIRST=$(echo "$RESP" | head -1)
              case "$FIRST" in
                *'"status":"deployed"'*)
                  echo "Deployed via /deploy/check (GitHub API)"
                  echo "$FIRST"
                  return 0
                  ;;
                *'"status":"current"'*)
                  if echo "$FIRST" | grep -q "\"tag\":\"$VER\""; then
                    echo "Confirmed on $VER via /deploy/check"
                    echo "$FIRST"
                    return 0
                  fi
                  CURRENT_TAG=$(echo "$FIRST" | sed 's/.*"tag":"\([^"]*\)".*/\1/')
                  echo "[poll $i/8] server on ${CURRENT_TAG:-?}, waiting for $VER"
                  ;;
                *'"status":"locked"'*)
                  echo "[poll $i/8] server still working (locked)"
                  ;;
                *)
                  echo "[poll $i/8] server busy (response not JSON yet)"
                  ;;
              esac
              [ "$i" -lt 8 ] && sleep 45
            done
            return 1
          }

          # Upload response can be lost mid-extract; confirm by polling /deploy/check.
          confirm_deployed() {
            for i in 1 2 3 4 5 6 7 8; do
              RESP=$(curl -s --max-time 120 "$CHECK_URL" 2>&1)
              FIRST=$(echo "$RESP" | head -1)
              case "$FIRST" in
                *'"status":"deployed"'*)
                  echo "Confirmed deployed via /deploy/check"
                  echo "$FIRST"
                  return 0
                  ;;
                *'"status":"current"'*)
                  if echo "$FIRST" | grep -q "\"tag\":\"$VER\""; then
                    echo "Confirmed on $VER via /deploy/check"
                    echo "$FIRST"
                    return 0
                  fi
                  echo "[confirm $i/8] tag not yet $VER, retrying"
                  ;;
                *'"status":"locked"'*)
                  echo "[confirm $i/8] server still working (locked), retrying"
                  ;;
                *)
                  echo "[confirm $i/8] server busy, retrying"
                  ;;
              esac
              [ "$i" -lt 8 ] && sleep 45
            done
            return 1
          }

          if poll_check; then
            echo "push-deploy OK (check path)"
          else
            echo "check path did not confirm $VER, uploading deploy.zip directly"
            UPLOAD_RESP=$(curl -s -w "\n%{http_code}" --max-time 300 \
              -F "file=@$STAGING_ZIP;filename=deploy.zip" \
              "$UPLOAD_URL" 2>&1)
            HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -1)
            BODY=$(echo "$UPLOAD_RESP" | sed '$d')
            echo "Upload HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | head -1 | grep -q '"status":"deployed"'; then
              echo "Deployed via /deploy/upload"
              echo "$BODY" | head -1
              echo "push-deploy OK (upload path)"
            else
              echo "Upload response not clean (HTTP $HTTP_CODE), confirming via /deploy/check..."
              if confirm_deployed; then
                echo "push-deploy OK (confirmed after upload)"
              else
                echo "Deploy not confirmed after upload. Release created at:"
                echo "https://github.com/nreljed/laravel.booking/releases/tag/$VER"
                echo "Manual deploy: download deploy.zip from release, upload to server, extract, then visit:"
                echo "$APP_URL/deploy/cache-clear?token=$DEPLOY_TOKEN"
                exit 1
              fi
            fi
          fi

      - name: FTP Upload fallback (DirectAdmin)
        # Only relevant when the hosting FTP account homes to this app's project
        # root. Skips itself when FTP_* secrets are not defined.
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          if ($env:FTP_USERNAME -eq "") { Write-Output "FTP_* secrets not set - skipping FTP fallback"; exit 0 }
          $ftpPort = if ($env:FTP_PORT) { $env:FTP_PORT } else { "21" }
          $ftpUrl = "ftp://${env:FTP_SERVER}:${ftpPort}/deploy.zip"
          $cred = New-Object System.Net.NetworkCredential($env:FTP_USERNAME, $env:FTP_PASSWORD)
          try {
            $ftp = [System.Net.FtpWebRequest]::Create($ftpUrl)
            $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
            $ftp.Credentials = $cred
            $ftp.UseBinary = $true
            $ftp.UsePassive = $true
            $ftp.KeepAlive = $false
            $fileBytes = [System.IO.File]::ReadAllBytes("$env:DEPLOY_STAGING/deploy.zip")
            $ftp.ContentLength = $fileBytes.Length
            $rs = $ftp.GetRequestStream()
            $rs.Write($fileBytes, 0, $fileBytes.Length)
            $rs.Close()
            $resp = $ftp.GetResponse()
            Write-Output "FTP upload OK: $($resp.StatusDescription)"
            $resp.Close()
            Write-Output "---"
            Write-Output "Extract via DirectAdmin File Manager, then visit:"
            Write-Output "${{ vars.APP_URL }}/deploy/cache-clear?token=(DEPLOY_TOKEN)"
          } catch {
            Write-Output "FTP upload failed: $_"
            Write-Output "Manual steps: download deploy.zip from the GitHub release, upload via File Manager, extract, then visit ${{ vars.APP_URL }}/deploy/cache-clear?token=<DEPLOY_TOKEN>"
          }
