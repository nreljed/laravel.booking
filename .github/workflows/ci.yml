name: CI Validation

on:
  workflow_call:
    inputs:
      skip-php-tests:
        description: "Skip PHP tests and Pint"
        type: boolean
        default: false
      skip-npm-tests:
        description: "Skip npm lint, typecheck, format, test, and build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Checkout dashboard-core package
        id: core
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: |
          mkdir -p ../../laravel
          git clone --depth 1 --branch beta "https://x-access-token:${{ secrets.PACKAGE_TOKEN }}@github.com/nreljed/laravel.git" ../../laravel/app
          echo "sha=$(git -C ../../laravel/app rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}-${{ steps.core.outputs.sha }}
          restore-keys: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}-

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Create .env + SQLite database
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install Composer dependencies
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Generate application key + migrate
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: php artisan key:generate && php artisan migrate --force

      - name: Install npm dependencies
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: npm ci --legacy-peer-deps

      - name: ESLint
        if: ${{ !inputs.skip-npm-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: npm run lint

      - name: TypeScript check
        if: ${{ !inputs.skip-npm-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: npm run typecheck

      - name: Prettier check
        if: ${{ !inputs.skip-npm-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: npm run format:check

      - name: Frontend tests
        if: ${{ !inputs.skip-npm-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: npm run test

      - name: Build frontend assets
        if: ${{ !inputs.skip-npm-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: npm run build

      - name: PHP tests
        if: ${{ !inputs.skip-php-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: php artisan test --compact

      - name: Laravel Pint
        if: ${{ !inputs.skip-php-tests }}
        shell: "C:\\Program Files\\Git\\bin\\bash.exe --login -eo pipefail {0}"
        run: vendor/bin/pint --test
