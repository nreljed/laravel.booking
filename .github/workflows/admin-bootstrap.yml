name: Admin Bootstrap

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: [self-hosted, local]
    steps:
      - name: Restore admin from secrets (per-request, nothing stored on server)
        shell: bash
        env:
          APP_URL: https://booking.laravel.tunispromo.tn
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -e
          for i in 1 2 3; do
            body=$(printf '{"email":"%s","name":"%s","password":"%s"}' "$ADMIN_EMAIL" "$ADMIN_NAME" "$ADMIN_PASSWORD")
            resp=$(curl -sS --max-time 60 -X POST "${APP_URL}/deploy/create-admin?token=${DEPLOY_TOKEN}" \
              -H "Content-Type: application/json" -d "$body" || echo "")
            echo "[admin $i/3] $resp"
            if printf '%s' "$resp" | grep -q '"status":"ok"'; then
              echo "Admin bootstrap OK"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Admin bootstrap did not confirm after 3 attempts"
          exit 1
