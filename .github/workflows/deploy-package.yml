name: Build Deploy Package

# Fixed local staging dir on win-runner-booking: downstream jobs (release,
# push-deploy) run on this same machine, so deploy.zip is handed off via disk
# instead of GitHub artifacts (artifact storage counts against the account-wide
# quota and exhausted it — 2026-08-22 deploy failure).
env:
  DEPLOY_STAGING: C:/actions-runner-booking/_staging

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the deploy.zip"
        required: true
        type: string
    outputs:
      version:
        description: "The version used"
        value: ${{ jobs.package.outputs.version }}

jobs:
  package:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: fileinfo, gd, mbstring, pdo_mysql, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $ver = "${{ inputs.version }}"
          } else {
            $ver = "0.1.0"
            $gcUrl = "https://github.com/orhun/git-cliff/releases/download/v2.8.0/git-cliff-2.8.0-x86_64-pc-windows-msvc.zip"
            $gcZip = "$env:TEMP\git-cliff.zip"
            Invoke-WebRequest -Uri $gcUrl -OutFile $gcZip -ErrorAction Stop
            Expand-Archive -Path $gcZip -DestinationPath "$env:TEMP\git-cliff" -Force
            $gc = Get-ChildItem -Path "$env:TEMP\git-cliff" -Recurse -Filter "git-cliff.exe" | Select-Object -First 1 -ExpandProperty FullName
            try {
              & $gc --bumped-version | Set-Content version.txt -NoNewline -ErrorAction Stop
              $ver = (Get-Content version.txt -Raw -ErrorAction Stop).Trim().TrimStart('v')
            } catch {
              Write-Output "git-cliff version detection failed, using 0.1.0: $_"
            }
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Generate build .env (SQLite)
        shell: pwsh
        run: |
          $dbPath = "$((Get-Location).Path.Replace('\', '/'))/database/database.sqlite"
          @"
          APP_NAME="Booking App"
          APP_ENV=local
          APP_KEY=base64:pHIa377aV0cusfWxNM2X3bpkWnRpztIQFwBGevG2DaY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=sqlite
          DB_DATABASE=$dbPath
          SESSION_DRIVER=file
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          DEPLOY_TOKEN=build
          GITHUB_TOKEN=build
          "@ | Set-Content -Path .env -Encoding UTF8
          New-Item -ItemType File -Path database/database.sqlite -Force

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies (dev)
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Package Discover
        run: php artisan package:discover --ansi

      - name: Run migrations (SQLite build)
        run: php artisan migrate --force

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend assets
        run: npm run build

      - name: Strip dev dependencies
        run: composer install --no-dev --optimize-autoloader --no-scripts

      - name: Overwrite .env with production settings
        shell: pwsh
        run: |
          @'
          APP_NAME="Booking App"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://booking.laravel.tunispromo.tn
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          BCRYPT_ROUNDS=12
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          SESSION_DOMAIN=.tunispromo.tn
          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=sync
          CACHE_STORE=file
          MAIL_MAILER=smtp
          MAIL_HOST=mail.tunispromo.tn
          MAIL_PORT=587
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS="booking.contact@tunispromo.tn"
          MAIL_FROM_NAME="Booking App"
          DEPLOY_TOKEN=${{ secrets.DEPLOY_TOKEN }}
          GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
          '@ | Set-Content -Path .env -Encoding UTF8

      - name: Copy deploy script
        run: Copy-Item -Path scripts/deploy-cron.php -Destination deploy.php

      - name: Record dashboard-core version
        shell: pwsh
        run: |
          $core = php -r "echo json_decode(file_get_contents('vendor/nreljed/dashboard-core/composer.json'))->version ?? 'unknown';"
          New-Item -ItemType Directory -Force -Path storage/app | Out-Null
          "{""name"":""dashboard-core"",""version"":""$core"",""sha"":null}" | Set-Content storage/app/core.json
          Write-Output "core.json recorded: dashboard-core $core"

      - name: Create deploy.zip
        shell: pwsh
        run: |
          $src = Get-Location
          $zip = "$src\deploy.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          if (Test-Path "$src\bootstrap\cache") {
            Move-Item "$src\bootstrap\cache" "$src\bootstrap\cache.bak"
          }
          $items = @(
            "artisan", "composer.json", "composer.lock", "package.json", "package-lock.json",
            "app", "bootstrap", "config", "database", "public", "resources", "routes",
            "storage", "vendor", "deploy.php", ".htaccess"
          )
          $fullPaths = $items | ForEach-Object { Join-Path $src $_ }
          Compress-Archive -Path $fullPaths -DestinationPath $zip -CompressionLevel Optimal
          $size = [Math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "deploy.zip created: $size MB"
          if (Test-Path "$src\bootstrap\cache.bak") {
            Remove-Item "$src\bootstrap\cache" -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item "$src\bootstrap\cache.bak" "$src\bootstrap\cache"
          }

      - name: Stage deploy.zip on runner disk
        shell: bash
        run: |
          mkdir -p "$DEPLOY_STAGING"
          cp deploy.zip "$DEPLOY_STAGING/deploy.zip"
          ls -la "$DEPLOY_STAGING"
